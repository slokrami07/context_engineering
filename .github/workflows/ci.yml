name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv pip install -e ".[dev]"
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv pip install -e ".[dev]"
      - name: Mypy
        run: uv run mypy src/ tests/

  test:
    name: Test (py${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install Package & Dev Dependencies
        run: uv pip install -e ".[dev]"
      - name: Run Tests
        run: uv run pytest -ra --strict-markers

  benchmark-smoke:
    name: Benchmark Smoke Test (Mock Backend)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install Package & Extras
        run: uv pip install -e ".[dev,bench]"
      - name: Run Benchmark Smoke Test
        run: |
          uv run python -c "from context_engineer import assemble_context, ContextConfig, Turn; print('Import and smoke test OK')"
