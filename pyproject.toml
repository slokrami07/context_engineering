[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineer"
version = "0.1.0"
description = "Deterministic prefix-cache aware context management layer for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Context Engineer Team" }
]
dependencies = [
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
