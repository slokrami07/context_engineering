[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineer"
version = "0.1.0"
description = "Deterministic prefix-cache aware context management layer for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Context Engineer Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.40.0",
]
tiktoken = [
    "tiktoken>=0.7.0",
]
rich = [
    "rich>=13.0.0",
]
dense = [
    "numpy>=1.24.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
redis = [
    "redis>=5.0.0",
]
bench = [
    "rich>=13.0.0",
    "transformers>=4.40.0",
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "transformers>=4.40.0",
]

[project.scripts]
context-engineer = "context_engineer.cli.chat:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["context_engineer*"]
exclude = ["tests*", "harness*", "benchmarks*"]

[tool.setuptools.package-data]
context_engineer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "transformers.*",
    "tiktoken.*",
]
ignore_missing_imports = true
